# infra/docker-compose.yml
# reapd local development stack.
#
# Services:
#   traefik       — Reverse proxy with wildcard *.preview.localhost TLS
#   socket-proxy  — Restricted Docker API proxy (read-only, no privileged ops)
#   postgres      — PostgreSQL 17 primary database
#   redis         — Redis 7 for BullMQ job queue + Redis Streams log buffer
#
# Networks:
#   control-internal  — API, Worker, PostgreSQL, Redis. Isolated from previews.
#   preview-edge      — Traefik + preview containers. icc=false between containers.

services:

  # ── Traefik v3 ─────────────────────────────────────────────────────────────
  traefik:
    # v3.6+ negotiates the Docker API version; v3.2 hard-codes 1.24, which
    # Docker Engine 29 (min API 1.40) rejects, so no routes are ever discovered.
    image: traefik:v3.6
    container_name: reapd-traefik
    restart: unless-stopped
    ports:
      - "127.0.0.1:80:80"        # HTTP (redirects → HTTPS), loopback only
      - "127.0.0.1:443:443"      # HTTPS wildcard *.preview.localhost, loopback only
      - "127.0.0.1:8080:8080"    # Traefik dashboard (dev only, loopback)
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - ./traefik/certs:/etc/traefik/certs:ro
    networks:
      - control-internal
      - preview-edge
    depends_on:
      - socket-proxy

  # ── Docker Socket Proxy ─────────────────────────────────────────────────────
  # The worker never mounts /var/run/docker.sock directly.
  # This proxy enforces read-only ACLs: containers, images, networks, build.
  # PRIVILEGED, HOST, and EXEC are all disabled.
  socket-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    container_name: reapd-socket-proxy
    restart: unless-stopped
    ports:
      # Loopback only: lets the local CLI/worker reach the proxy without exposing it to the LAN
      - "127.0.0.1:2375:2375"
    environment:
      # Required for container create/start/remove and image builds (default is read-only)
      POST: 1
      # Allowed endpoints (1 = enabled)
      CONTAINERS: 1
      IMAGES: 1
      NETWORKS: 1
      BUILD: 1
      # EVENTS=1 is required by Traefik's watch=true Docker provider for instant
      # container discovery; SESSION=1 & GRPC=1 are required by BuildKit.
      EVENTS: 1
      SESSION: 1
      GRPC: 1
      # Blocked endpoints (0 = disabled)
      PRIVILEGED: 0
      HOST: 0
      EXEC: 0
      VOLUMES: 0
      SWARM: 0
      INFO: 1
      PING: 1
      VERSION: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - control-internal

  # ── PostgreSQL 17 ───────────────────────────────────────────────────────────
  postgres:
    image: postgres:17-alpine
    container_name: reapd-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: reapd
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run `npm run env:init` to generate .env}
      POSTGRES_DB: reapd
    ports:
      - "127.0.0.1:5432:5432"    # Loopback only: local psql / Drizzle Studio access
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - control-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U reapd -d reapd"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ── Redis 7 ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: reapd-redis
    restart: unless-stopped
    # Password comes from .env (generated by `npm run env:init`). `redis-server` must stay the first
    # argument so the image entrypoint drops privileges to the `redis` user (a `sh -c` wrapper would
    # leave it running as root). REDISCLI_AUTH makes the in-container redis-cli (healthcheck,
    # `docker exec ... redis-cli` in smoke scripts) authenticate automatically.
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?run `npm run env:init` to generate .env}
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction", "--save", "", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "127.0.0.1:6379:6379"    # Loopback only: local redis-cli / BullMQ access (password required)
    networks:
      - control-internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Prometheus ──────────────────────────────────────────────────────────────
  # Scrapes the API (:3001/metrics) and worker (:9091/metrics) running on the host.
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: reapd-prometheus
    restart: unless-stopped
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - control-internal

  # ── Grafana ─────────────────────────────────────────────────────────────────
  # Dashboard + datasource are provisioned from ./observability/grafana.
  grafana:
    image: grafana/grafana:11.3.0
    container_name: reapd-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3030:3000"
    depends_on:
      - prometheus
    networks:
      - control-internal

# ── Volumes ──────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local

# ── Networks ─────────────────────────────────────────────────────────────────
networks:
  control-internal:
    name: reapd-control-internal
    driver: bridge
    # NOTE: not `internal: true` locally, because published ports (postgres/redis)
    # don't work on internal networks. Production sets internal: true (Phase 7).

  preview-edge:
    name: reapd-preview-edge
    driver: bridge
    # NOTE: enable_icc=false is deferred to Phase 7. With icc disabled on a shared
    # bridge, Traefik (same bridge) also cannot reach preview containers, so the
    # PRD's isolation design needs revisiting (e.g. per-PR networks that Traefik joins,
    # or DOCKER-USER rules that allow only Traefik -> previews).

