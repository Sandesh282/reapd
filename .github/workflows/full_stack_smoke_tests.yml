name: Full-stack smoke tests

permissions: read-all

on:
  push:
    branches:
      - main
      - release-*
  pull_request:
    branches:
      - main
      - release-*
    types:
      - opened
      - synchronize
      - reopened

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify_smoke_coverage:
    name: Verify all smoke scripts are included in CI
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: Check that every infra/scripts/*-smoke.sh file is registered in this workflow
        run: |
          for script in infra/scripts/*-smoke.sh; do
            base=$(basename "$script")
            if ! grep -q "$base" .github/workflows/full_stack_smoke_tests.yml; then
              echo "❌ Smoke script $script is not included in .github/workflows/full_stack_smoke_tests.yml matrix"
              exit 1
            fi
          done

  e2e_smoke_gate:
    name: E2E Smoke (${{ matrix.gate.label }})
    needs: [verify_smoke_coverage]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        gate:
          - label: 'Phase 1 — Hardened Container & Traefik TLS'
            script: './infra/scripts/cli-smoke.sh'
          - label: 'Phase 2 — CLI Git Clone & BuildKit Lifecycle'
            script: './infra/scripts/phase2-smoke.sh'
          - label: 'Phase 3 — Webhook HMAC, Idempotency & Worker'
            script: './infra/scripts/phase3-smoke.sh'
          - label: 'Phase 4 — Rapid Superseding & Desired-State Reconciler'
            script: './infra/scripts/phase4-smoke.sh'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: Set up Node & dependencies
        uses: ./.github/actions/setup-node-and-deps

      - name: Install mkcert and generate wildcard *.preview.localhost TLS certs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libnss3-tools ca-certificates
          curl -fsSL "https://dl.filippo.io/mkcert/latest?for=linux/amd64" -o mkcert
          chmod +x mkcert
          sudo mv mkcert /usr/local/bin/mkcert
          mkcert -install
          ./infra/scripts/gen-certs.sh

      - name: Configure *.preview.localhost in /etc/hosts for curl on Linux runners
        run: |
          echo "127.0.0.1 pr-1.preview.localhost pr-2.preview.localhost pr-104.preview.localhost pr-202.preview.localhost pr-301.preview.localhost pr-401.preview.localhost" | sudo tee -a /etc/hosts

      - name: Boot Docker Compose stack & apply PostgreSQL 17 schema
        run: |
          docker compose -f infra/docker-compose.yml up -d --wait
          docker exec -i reapd-postgres psql -U reapd -d reapd < packages/db/src/migrations/0001_initial_schema.sql

      - name: Run ${{ matrix.gate.script }}
        run: ${{ matrix.gate.script }}

  check_all_smoke_tests_pass:
    name: Check that all necessary tests pass
    needs: [verify_smoke_coverage, e2e_smoke_gate]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Verify all E2E smoke shards succeeded
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
      - name: All E2E smoke gates passed
        run: echo "✅ All full-stack smoke gates passed"
